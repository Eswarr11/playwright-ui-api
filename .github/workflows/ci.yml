name: Playwright Tests

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'timings.json'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'timings.json'

permissions:
  contents: read
  actions: write

env:
  API_BASE_URL: https://fakestoreapi.com
  UI_BASE_URL: https://www.saucedemo.com
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality

  setup-auth:
    name: Generate auth sessions
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run global setup
        run: npx ts-node scripts/run-auth-setup.ts
        env:
          CI: true

      - name: Verify auth files
        run: |
          ls -la .auth/
          test "$(find .auth -name '*.json' | wc -l)" -ge 1

      - name: Upload auth state
        uses: actions/upload-artifact@v4
        with:
          name: auth-state
          path: .auth
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  api-tests:
    name: API shard ${{ matrix.shard }}/5
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      CI: true
      WORKERS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test api/tests --project=api --shard=${{ matrix.shard }}/5

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-blob-report-shard-${{ matrix.shard }}
          path: reports/blob
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results-shard-${{ matrix.shard }}
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 1

      - name: Upload flakiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-flakiness-report-shard-${{ matrix.shard }}
          path: reports/flakiness
          if-no-files-found: warn
          retention-days: 1

  merge-reports:
    name: Merge API and UI reports
    needs: [api-tests, ui-tests, quality-gates]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-blob-reports
          pattern: '*-blob-report-shard-*'
          merge-multiple: true

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: combined-allure-results
          pattern: '*-allure-results-shard-*'
          merge-multiple: true

      - name: Download flakiness reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-flakiness-reports
          pattern: '*-flakiness-report-shard-*'

      - name: Merge Playwright reports
        run: npx playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports
        continue-on-error: true

      - name: Generate Allure report
        run: npx allure generate combined-allure-results --clean -o allure-report
        continue-on-error: true

      - name: Build timings.json
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mapfile -t reports < <(find all-flakiness-reports -name 'report.json' -type f 2>/dev/null)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No flakiness reports found; skipping timings.json update."
            exit 0
          fi
          npx flakiness-playwright-timings build -o timings.json "${reports[@]}"

      - name: Upload combined reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-reports-${{ github.run_number }}
          path: |
            playwright-report/
            allure-report/
            timings.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push timings.json
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          if [ ! -f timings.json ]; then
            echo "timings.json was not generated; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timings.json
          if git diff --staged --quiet; then
            echo "timings.json is unchanged."
            exit 0
          fi
          git commit -m "chore: update Playwright shard timings [skip ci]"
          git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

  ui-tests:
    name: UI shard ${{ matrix.shard }}/5
    needs: [setup-auth, quality-gates]
    if: ${{ needs.setup-auth.result == 'success' && needs.quality-gates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      CI: true
      WORKERS: '2'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: Download auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: .auth

      - name: Verify auth files
        run: |
          ls -la .auth/
          test "$(find .auth -name '*.json' | wc -l)" -ge 1

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npx playwright test ui/tests --project=ui --shard=${{ matrix.shard }}/5

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-blob-report-shard-${{ matrix.shard }}
          path: reports/blob
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results-shard-${{ matrix.shard }}
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 1

      - name: Upload flakiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-flakiness-report-shard-${{ matrix.shard }}
          path: reports/flakiness
          if-no-files-found: warn
          retention-days: 1
